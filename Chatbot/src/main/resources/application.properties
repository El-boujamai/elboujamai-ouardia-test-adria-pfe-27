spring.application.name=Chatbot
server.port=8084


# Enregistrement Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Configuration de la clé API Gemini / Google GenAI
spring.ai.google.genai.api-key=os.path(CLE_API_GEMINI_ICI)
spring.ai.google.genai.chat.options.model=gemini-1.5-flash
